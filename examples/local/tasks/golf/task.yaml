# A toy task with nothing to do with speed: make a correct program as short as possible.

instruction: |
  `solution.py` defines `is_prime(number)`, which must return a true value exactly for prime numbers.
  It is checked on every integer from -5 to 100.

  Make `solution.py` as short as you can, counted in bytes, without changing what `is_prime` returns.
  `solution.py` must stay the only file.

time_limit_seconds: 600

# Run in a clean copy of the work; {task} is this directory, {python} the interpreter running the campaign.
evaluate: ["{python}", "{task}/evaluate.py"]

declaration:
  metrics:
    bytes: {direction: min, scale: absolute, anchor: baseline, format: "{:.0f}"}
  gate: [tests_pass, only_solution]
  rank_by: bytes

prompt:
  goal: You are shortening the program described below.
  working: >-
    Work in the directory you are started in. Whatever differs from its starting state when you end the
    session is your work.
  ranking: >-
    by the size of `solution.py` in bytes, smaller being better, among versions that pass every check.
    The size is exact, so there is no measurement noise.
  feedback: >-
    To check a version yourself, import it and compare `is_prime` with a list of primes you trust.
