# The golf task, driven by the stand-in agent. Run from the repository root:
#   infinievolve run examples/local/campaigns/demo

campaign:
  adapter: ../../adapter.py:LocalAdapter     # relative to this directory
  tasks: [golf]
  max_parallel: 1
  poll_seconds: 0.2

agent:
  program: fake_agent.py

strategy:
  start: best

stop:
  max_sessions: 10
  window_k: 2
  min_improvement: 0       # bytes: stop once two sessions in a row saved nothing

options:
  tasks_dir: ../../tasks   # relative to this directory
  # Any shell command works here; it is run in the working copy with EVOLVE_PROMPT set. For a real agent,
  # hand it the prompt, for example:   your-agent --prompt-file "$EVOLVE_PROMPT"
  agent_command: python3 "$EVOLVE_CAMPAIGN/../../fake_agent.py"
