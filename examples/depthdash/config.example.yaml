# Run inside the GPU allocation selected when preparing the task.
# Copy to a campaign directory; replace YOUR_MODEL and task_dir.
campaign:
  adapter: examples/depthdash/adapter.py:DepthDashAdapter
  tasks: [deep]
  max_parallel: 1
  poll_seconds: 5

# Credentials come from your existing Claude Code login/environment.
# Bash enables compilation, profiling, equivalence checks and development training.
agent:
  command: >-
    claude -p --model YOUR_MODEL --effort medium
    --output-format stream-json --verbose --no-session-persistence
    --permission-mode acceptEdits
    --setting-sources '' --strict-mcp-config --mcp-config '{"mcpServers":{}}'
    --append-system-prompt "Read the full archive at $EVOLVE_ARCHIVE and follow the task's DepthDash rules. You may write Triton/CUDA operators, compile them and run GPU tests or development training."
    --tools 'Read,Glob,Grep,Edit,Write,Bash'
    --allowedTools 'Read' 'Glob' 'Grep' 'Edit' 'Write' 'Bash'

strategy:
  start: best
# Session count and stopping rules use InfiniEvolve defaults unless configured here.
# Set campaign/resource budgets explicitly for your allocation; none are benchmark rules.
prompt:
  carry: full
options:
  task_dir: /absolute/path/to/deep
