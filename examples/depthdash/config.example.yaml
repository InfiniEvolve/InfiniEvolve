# Run inside the GPU allocation selected when preparing the task.
# Copy to a campaign directory; replace YOUR_MODEL and task_dir.
campaign:
  adapter: examples/depthdash/adapter.py:DepthDashAdapter
  tasks: [deep]
  max_parallel: 1
  poll_seconds: 5

# Credentials come from your existing Claude Code login/environment.
# Set ARIS_REPO to the installed ARIS plugin directory (see README).
# Bash enables compilation/GPU tests; Skill/WebSearch/WebFetch enable research.
agent:
  command: >-
    claude -p --model YOUR_MODEL --effort medium
    --output-format stream-json --verbose --no-session-persistence
    --permission-mode acceptEdits
    --setting-sources '' --strict-mcp-config --mcp-config '{"mcpServers":{}}'
    --plugin-dir "${ARIS_REPO:?Set ARIS_REPO to the installed ARIS plugin directory}"
    --append-system-prompt "At the start of every session, follow the task's research-first instructions and invoke aris:research-lit before implementing. Read the full archive at $EVOLVE_ARCHIVE, update research/REVIEW.md with verified sources and the next hypothesis, and follow the task's DepthDash rules. You may write Triton/CUDA operators, compile them and run GPU tests or development training. Read the effective session time limit before scheduling long tests, and select your best supported submission before that deadline."
    --tools 'Read,Glob,Grep,Edit,Write,Bash,Skill,WebSearch,WebFetch'
    --allowedTools 'Read' 'Glob' 'Grep' 'Edit' 'Write' 'Bash' 'Skill' 'WebSearch' 'WebFetch'

strategy:
  start: best
# Session count and stopping rules use InfiniEvolve defaults unless configured here.
# Set campaign/resource budgets explicitly for your allocation; none are benchmark rules.
prompt:
  carry: full
options:
  task_dir: /absolute/path/to/deep
