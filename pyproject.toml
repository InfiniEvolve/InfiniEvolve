[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infinievolve"
version = "0.1.0"
description = "An outer loop over coding-agent sessions: one lineage per task, every session archived"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
infinievolve = "infinievolve.cli:main"

[tool.setuptools.packages.find]
include = ["infinievolve*"]

[tool.setuptools.package-data]
infinievolve = ["prompts/*.md", "templates/*.yaml"]
